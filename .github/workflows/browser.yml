name: Browser smoke tests

# Runs the Playwright scenarios tagged @smoke against the application served
# by `php artisan serve`. The Pest suite renders markup on the server and runs
# no JavaScript, so a broken Alpine component or a map that never initialises
# only shows up here.
#
# Only scenarios that need no external case system and no Sail container, and
# that pass reliably against `php artisan serve`, are tagged @smoke.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'resources/**'
      - 'routes/**'
      - 'config/**'
      - 'database/**'
      - 'public/**'
      - 'composer.lock'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'playwright.config.mjs'
      - 'tests/Playwright/**'
      - '.github/workflows/browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-smoke:
    runs-on: ubuntu-latest
    name: Run browser smoke tests
    timeout-minutes: 25
    services:
      pgsql:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: eventloket
          POSTGRES_USER: eventloket
          POSTGRES_PASSWORD: eventloket
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U eventloket" --health-interval=10s --health-timeout=5s --health-retries=5

    # Set on the job, so they win over .env (a copy of .env.example) for
    # artisan, for the server started with --no-reload and for Playwright.
    env:
      CI: true
      EF_BASE_URL: http://127.0.0.1:8000
      APP_ENV: local
      APP_URL: http://127.0.0.1:8000
      APP_REQUIRE_2FA: false
      DEBUGBAR_ENABLED: false
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: eventloket
      DB_USERNAME: eventloket
      DB_PASSWORD: eventloket
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      CACHE_STORE: file
      PHP_CLI_SERVER_WORKERS: 4

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: 8.4
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, pgsql, bcmath, soap, intl, gd, exif, iconv, imagick
        coverage: none

    - name: Setup NodeJS
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        cache: npm

    - name: Install Composer dependencies
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Install NodeJS dependencies
      run: npm ci

    - name: Prepare application
      run: |
        cp .env.example .env
        php artisan key:generate
        php artisan passport:keys
        npm run build

    - name: Migrate and seed
      # ZaakSeeder and ThreadSeeder need a live case system and are skipped.
      run: |
        php artisan migrate --force
        php artisan db:seed --force --class=UserSeeder
        php artisan db:seed --force --class=SouthLimburgMunicipalitiesSeeder
        php artisan db:seed --force --class=OrganisationSeeder
        php artisan db:seed --force --class=AdvisorySeeder
        php artisan db:seed --force --class=PlaywrightUserSeeder

    - name: Install Chromium
      run: npx playwright install --with-deps chromium

    - name: Start the application
      run: |
        php artisan serve --no-reload --host=127.0.0.1 --port=8000 > storage/logs/serve.log 2>&1 &
        for attempt in $(seq 1 30); do
          if curl --silent --fail --output /dev/null http://127.0.0.1:8000/organiser/login; then
            exit 0
          fi
          sleep 1
        done
        echo "The application did not answer within 30 seconds." >&2
        cat storage/logs/serve.log >&2
        exit 1

    - name: Run browser smoke tests
      run: npx playwright test --project=chromium --grep @smoke

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-results
        path: |
          test-results/
          storage/logs/
        retention-days: 7
