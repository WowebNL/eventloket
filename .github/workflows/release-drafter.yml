name: Release Drafter

# Only the autolabeler runs here: it labels pull requests for the changelog based on
# their branch name and title. Release drafts are prepared by a maintainer on a fixed
# commit (see docs/RELEASE_PROCESS.md), so the releaser mode is disabled.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  # pull_request_target event is required for autolabeler to support PRs from forks
  # pull_request_target:
  #   types: [opened, reopened, synchronize]
permissions:
    contents: read
    pull-requests: write
jobs:
  autolabel:
    runs-on: ubuntu-latest
    steps:
      - name: 🏷️ Label pull request
        uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
        with:
          disable-releaser: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
