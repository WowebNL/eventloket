# Version updates are paused: every entry sets open-pull-requests-limit to 0,
# so Dependabot opens no version update pull requests. Minor and patch updates
# are taken in a periodic maintenance update instead, and major updates are
# planned as part of a larger upgrade. To turn version updates back on,
# restore open-pull-requests-limit to 5 on each entry.
# For Composer and npm, a new release is only proposed once it is at least
# 7 days old.
# Vulnerable dependencies are reported through Dependabot alerts and are
# handled outside this schedule.
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    labels:
      - "changelog: dependencies"
    commit-message:
      prefix: "dep"
    groups:
      composer-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      composer-major:
        applies-to: version-updates
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    labels:
      - "changelog: dependencies"
    commit-message:
      prefix: "dep"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      npm-major:
        applies-to: version-updates
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    labels:
      - "changelog: dependencies"
    commit-message:
      prefix: "dep"
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        applies-to: version-updates
        update-types:
          - "major"
