# Version updates: once a month, two pull requests per ecosystem. One
# combines all minor and patch updates, the other combines all major
# updates, which serve as input for planning major upgrades.
# Security updates are not grouped and are raised as soon as an alert is published.
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "changelog: dependencies"
    commit-message:
      prefix: "dep"
    groups:
      composer-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      composer-major:
        applies-to: version-updates
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "changelog: dependencies"
    commit-message:
      prefix: "dep"
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      npm-major:
        applies-to: version-updates
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "changelog: dependencies"
    commit-message:
      prefix: "dep"
    groups:
      github-actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        applies-to: version-updates
        update-types:
          - "major"
