# Only the autolabeler of Release Drafter is used (see .github/workflows/release-drafter.yml).
# Release drafts are prepared by a maintainer, so no release template, categories or
# version resolver are configured here. `template` is required by the configuration
# schema and is otherwise unused.
template: |
  $CHANGES

autolabeler:
  - label: 'changelog: feature'
    branch:
      - '/feat\/.+/'
    title:
      - '/feat/i'
  - label: 'changelog: bug'
    branch:
      - '/fix\/.+/'
    title:
      - '/fix/i'
  - label: 'changelog: breaking'
    branch:
      - '/major\/.+/'
    body:
      - '/BREAKING CHANGES/i'
    title:
      - '/BREAKING CHANGES/i'
  - label: 'changelog: dependencies'
    title:
      - '/dep:/i'
